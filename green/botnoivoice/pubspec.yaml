name: botnoivoice
description: "Botnoi Voice Mobile"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
# 1.0.0 คือ flutterVersionName
# 1 คือ flutterVersionCode

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  story_view: ^0.16.5
  # ไล่ แฉด สี
  gradient_borders: ^1.0.1
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  pixel_perfect: ^1.1.3
  transparent_image: ^2.0.1
  flutter_riverpod: ^2.5.1

  # text to voice generate and play audio
  http: ^1.2.1 # http: ^0.13.3
  audioplayers: ^6.0.0 # audioplayers: ^1.0.1
  path_provider: ^2.1.3
  open_app_file: ^4.0.2
  permission_handler: ^11.3.1

  # เพื่อเปิดไฟล์โดยใช้ URL ตรงของไฟล์ที่ดาวน์โหลดมาใหม่ โดยไม่ต้องผ่านทาง Content URI
  url_launcher: ^6.0.0

  # import function from other file
  provider: ^6.1.2
  
  # firebase and flutterfire
  foundation: ^0.0.5
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  # sign-in
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^4.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/logo/
    - assets/icon/

  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
