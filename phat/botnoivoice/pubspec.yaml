name: botnoivoice
description: "Botnoi Voice Mobile"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
# 1.0.0 คือ flutterVersionName
# 1 คือ flutterVersionCode

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  story_view: ^0.16.5
  # ไล่ แฉด สี
  gradient_borders: ^1.0.1
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  pixel_perfect: ^1.1.3
  transparent_image: ^2.0.1
  flutter_riverpod: ^2.5.1
  auto_size_text: ^3.0.0

  # text to voice generate and play audio
  http: ^1.2.1 
  audioplayers: ^6.0.0 
  path_provider: ^2.1.3
  open_app_file: ^4.0.2

  # เพื่อเปิดไฟล์โดยใช้ URL ตรงของไฟล์ที่ดาวน์โหลดมาใหม่ โดยไม่ต้องผ่านทาง Content URI
  url_launcher: ^6.0.0

  # import function from other file
  provider: ^6.1.2
  
  # firebase and flutterfire
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  google_sign_in: ^6.2.1
  shared_preferences: ^2.2.3
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  image_path: "assets/icons/icon.png"
  android: true
  ios: true 
  remove_alpha_ios: true
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/icons/

