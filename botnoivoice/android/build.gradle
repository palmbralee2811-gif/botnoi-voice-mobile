// For old Kotlin version variable
ext.kotlin_version = '1.9.0'

allprojects {
    repositories {
        google()
        mavenCentral()
        // Maven repository for Flutter plugins
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }
}

// Configure all subprojects
subprojects {
    // Dependency version resolution for old support libraries
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.support'
                        && !details.requested.name.contains('multidex')) {
                details.useVersion "28.0.0"
            }
        }
    }
    
    // Configure Android library plugins
    plugins.withId('com.android.library') {
        android {
            // Set compileSdk if not already set
            if (!android.compileSdk) {
                compileSdk = 35
            }
            
            buildFeatures {
                buildConfig = true
            }
        }
        
        // Add flutter extension for old plugins
        if (!extensions.findByName('flutter')) {
            extensions.create('flutter', FlutterExtensionCompat)
        }
    }
}

// Compatibility extension for old Flutter plugins
class FlutterExtensionCompat {
    def source = null
    def compileSdkVersion = 35
}

rootProject.buildDir = "../build"
subprojects {
    String rootDrive = rootProject.rootDir.absolutePath.substring(0, 1).toLowerCase()
    String projectDrive = project.projectDir.absolutePath.substring(0, 1).toLowerCase()
    if (rootDrive != projectDrive) {
        project.buildDir = "${project.projectDir}/build"
    } else {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
    }
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}